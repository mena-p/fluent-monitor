[project]
name = "fluent-monitor"
version = "2.2.0"
description = "Live plots of Ansys Fluent report files (.out) without the Fluent GUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqtgraph>=0.13.7",
    "PySide6-Essentials>=6.7",
    "numpy>=1.26",
]

[project.scripts]
fluent-monitor = "fluent_monitor.app:run"
fluent-monitor-web = "fluent_monitor.web:run"

# Same program without a console window (Windows), for `uv tool install .`
[project.gui-scripts]
fluent-monitor-gui = "fluent_monitor.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_monitor"]
