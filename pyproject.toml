[project]
name = "fluent-monitor"
version = "3.1.2"
description = "Live plots of Ansys Fluent report files, residuals and solver messages in the browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "smbprotocol>=1.14",   # reads smb://server/share folders directly (Docker on Unraid)
]

[project.scripts]
fluent-monitor = "fluent_monitor.web:run"
fluent-monitor-web = "fluent_monitor.web:run"   # old name, same program

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_monitor"]
